name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Node 20 is the floor in `engines`; drop it here and there together.
      # macOS too, since that's where most people run a CLI like this, and
      # file modes and signals behave differently there than on Linux.
      matrix:
        os: [ubuntu-latest]
        node: ["20", "22", "24"]
        include:
          - os: macos-latest
            node: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  publish:
    # Tags only, and only after every test job is green.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC): no NPM_TOKEN secret exists to leak.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+; staging needs 11.15+.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm install -g npm@^11.15.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund

      # npm publishes whatever `version` says, whatever the tag is.
      - name: Tag must match package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # Staged, not live: it waits on npmjs.com until a maintainer approves
      # it with 2FA.
      - run: npm stage publish --access public
